[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-health-agent"
version = "2.0.0"
description = "AI agent that scores project health from messy PMO exports and synthesizes an executive portfolio review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "pandas>=2.2,<3.1",
    "openpyxl>=3.1,<4.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "typer>=0.12,<1.0",
    "tenacity>=8.2,<9.0",
    "python-pptx>=1.0,<1.1",
    "python-docx>=1.1,<2.0",
    "langgraph>=0.2,<2.0",
    "langchain-core>=0.3,<2.0",
    "groq>=1.5,<2.0",
    "google-genai>=1.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "rank-bm25>=0.2,<0.3",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
# Only needed when DATA_SOURCE=drive. Kept optional so local-only dev/CI
# installs stay lean and never need Google credentials to run tests.
drive = [
    "google-api-python-client>=2.120,<3.0",
    "google-auth>=2.28,<3.0",
]
# The Streamlit frontend (frontend/) is a standalone client of the FastAPI
# app over HTTP, not an import-time dependency of project_health_agent —
# kept as its own extra so a pure-API deployment doesn't need Streamlit.
frontend = [
    "streamlit>=1.35,<2.0",
    "requests>=2.31,<3.0",
    "plotly>=5.20,<6.0",
    "pandas>=2.2,<3.1",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.12,<4.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pandas-stubs>=2.2,<3.0",
]

[project.scripts]
project-health-weekly = "project_health_agent.cli.weekly:app"
project-health-monthly = "project_health_agent.cli.monthly:app"

[tool.hatch.build.targets.wheel]
packages = ["src/project_health_agent"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]  # zip() strict= not required across this codebase's Python floor

[tool.ruff.lint.per-file-ignores]
# Long descriptive strings (score explanations, recommendations) read better
# as single lines than force-wrapped; treated as content, not code style.
"src/project_health_agent/scoring/metrics.py" = ["E501"]
"src/project_health_agent/reasoning/graph.py" = ["E501"]
"src/project_health_agent/cli/weekly.py" = ["E501"]
"src/project_health_agent/aggregation/synthesis_agent.py" = ["E501"]
"src/project_health_agent/aggregation/aggregator.py" = ["B007"]
# FastAPI's dependency-injection idiom requires calling Body()/File()/Depends()
# as argument defaults — that's the framework's documented pattern, not a bug.
"src/project_health_agent/api/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
